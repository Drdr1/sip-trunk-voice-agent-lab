[general]
static=yes

; The "agent": answers and echoes audio back, so two-way media through the bridge
; shows up on the carrier leg. Only E.164 numbers are accepted, like the platform.
[agent]
exten => _+X.,1,NoOp(AGENT @NAME@ got ${EXTEN} caller=${PJSIP_HEADER(read,X-Caller-ID)})
 same => n,Answer()
 same => n,Echo()
exten => _X.,1,NoOp(AGENT @NAME@ rejected non-E164 ${EXTEN})
 same => n,Hangup(1)
