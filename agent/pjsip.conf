; Stand-in for the hosted voice-agent platform. Behaves the way the bridge has to
; deal with: TLS 5061 only, SRTP required, G.711/G.722 offered, E.164 in the R-URI.
; @IP@ @NAME@ @RUN@ are filled in by lab/run.sh.
[global]
type=global
user_agent=agent-sim-@NAME@

[t-tls]
type=transport
protocol=tls
bind=@IP@:5061
method=tlsv1_2
cert_file=@RUN@/../certs/@NAME@.crt
priv_key_file=@RUN@/../certs/@NAME@.key
ca_list_file=@RUN@/../certs/ca.crt
verify_client=no

[bridge]
type=endpoint
transport=t-tls
context=agent
disallow=all
allow=g722,alaw,ulaw
media_encryption=sdes
media_encryption_optimistic=no   ; "Required": a plain RTP offer is rejected
direct_media=no
rtp_symmetric=yes
dtmf_mode=rfc4733

[bridge]
type=identify
endpoint=bridge
match=203.0.113.1
