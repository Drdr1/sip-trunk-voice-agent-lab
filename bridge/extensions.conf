[general]
static=yes
writeprotect=yes

[globals]
; national number arriving from the operator -> E.164 the platform expects
CC=966
DIAL_TIMEOUT=8

; ---------------------------------------------------------------------------
; Inbound from the operator. Order: primary platform -> secondary -> local fallback.
; A target whose OPTIONS qualify is failing is skipped immediately, so callers
; don't sit through a dead TLS connect before failover.
; ---------------------------------------------------------------------------
[from-carrier]
exten => _X.,1,NoOp(IN from=${CALLERID(num)} to=${EXTEN})
 same => n,Set(E164=${IF($["${EXTEN:0:1}" = "+"]?${EXTEN}:+${CC}${EXTEN})})
 same => n,Set(CDR(userfield)=${E164})
 same => n,Set(__ORIG_CALLER=${CALLERID(num)})   ; inherited by the outbound leg
 same => n,Gosub(try-agent,s,1(agent-a))
 same => n,GotoIf($["${GOSUB_RETVAL}" = "done"]?end)
 same => n,Gosub(try-agent,s,1(agent-b))
 same => n,GotoIf($["${GOSUB_RETVAL}" = "done"]?end)
 ; both platforms unavailable: the number still answers
 same => n(fallback),NoOp(FAILOVER=local)
 same => n,Set(CDR(userfield)=${E164}|fallback)
 same => n,Answer()
 same => n,Playback(ss-noservice)
 ; production: Dial a human overflow number back out over the trunk, or voicemail
 same => n(end),Hangup()

[try-agent]
exten => s,1,Set(AOR_CONTACT=${PJSIP_AOR(${ARG1},contact)})
 same => n,Set(STATUS=${IF($["${AOR_CONTACT}" != ""]?${PJSIP_CONTACT(${AOR_CONTACT},status)}:Unknown)})
 same => n,NoOp(TRY ${ARG1} contact_status=${STATUS})
 same => n,GotoIf($["${STATUS}" = "Unreachable"]?skip)
 same => n,Dial(PJSIP/${E164}@${ARG1},${DIAL_TIMEOUT},b(agent-headers^s^1))
 same => n,NoOp(RESULT ${ARG1} DIALSTATUS=${DIALSTATUS} HANGUPCAUSE=${HANGUPCAUSE})
 same => n,Return(${IF($["${DIALSTATUS}" = "ANSWER"]?done:next)})
 same => n(skip),NoOp(SKIP ${ARG1} (qualify says unreachable))
 same => n,Return(next)

; pre-dial handler on the outbound leg: pass caller identity to the agent
; (X- headers become dynamic variables on the platform side)
[agent-headers]
exten => s,1,Set(PJSIP_HEADER(add,X-Caller-ID)=${ORIG_CALLER})
 same => n,Set(PJSIP_HEADER(add,X-Trunk-Called)=${E164})
 same => n,Return()

; nothing should originate from the platform side in this design
[from-agent]
exten => _X.,1,Hangup(21)
exten => _+X.,1,Hangup(21)
