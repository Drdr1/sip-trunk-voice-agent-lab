; ============================================================================
; Bridge PBX: operator SIP trunk (private circuit, UDP, G.711 A-law, IP-authenticated)
;          -> voice-agent platform (TLS 5061, SRTP/SDES, G.711)
; @RUN@ is replaced with the instance directory by lab/run.sh.
; For a real deployment replace the lab IPs, the agent AORs and the certs.
; ============================================================================

[global]
type=global
user_agent=bridge-lab
; keep the Request-URI user exactly as dialled (E.164 with +)
endpoint_identifier_order=ip,username

; Transaction timers. Found in this lab (tests/run_all.sh scenario 3): when the
; primary target dies, the next INVITE goes out on a TLS connection that gets an
; instant RST, but the transaction is NOT failed on the transport error. The caller
; sits in silence until timer B (default 64*T1 = 32 s) or the Dial timeout fires.
; Asterisk will not take timer B below 64*T1, so the lever is T1:
;   T1 = 100 ms  ->  timer B = 6.4 s worst case before moving to the next target.
; Combined with a 5 s OPTIONS qualify, most outages are skipped with no delay at all.
; T1 also paces UDP retransmits on the carrier leg (100, 200, 400 ms ...), which is
; fine on a private circuit with single-digit ms RTT.
[system]
type=system
timer_t1=100
timer_b=6400

; ---------------------------------------------------------------- transports
; Trunk side: bound ONLY to the circuit address. Nothing on this side is internet-facing.
[t-trunk]
type=transport
protocol=udp
bind=10.20.0.1:5060
local_net=10.20.0.0/30

; Platform side: TLS 1.2+, server cert verified.
; In production also set external_signaling_address / external_media_address
; if the bridge sits behind 1:1 NAT (cloud VM with an elastic IP).
[t-agent]
type=transport
protocol=tls
bind=203.0.113.1:5061
method=tlsv1_2
cert_file=@RUN@/../certs/sbc.crt
priv_key_file=@RUN@/../certs/sbc.key
ca_list_file=@RUN@/../certs/ca.crt
verify_server=yes
verify_client=no

; ---------------------------------------------------------------- operator trunk
[carrier]
type=endpoint
transport=t-trunk
context=from-carrier
disallow=all
allow=alaw                 ; what the operator hands over: G.711 A-law 8 kHz
dtmf_mode=rfc4733
direct_media=no            ; media is anchored on the bridge, never sent carrier <-> platform directly
rtp_symmetric=no           ; private circuit, no NAT: trust the SDP
force_rport=no
media_address=10.20.0.1    ; the c= line the carrier sees. Wrong value here = one-way audio.
send_pai=yes
trust_id_inbound=yes
aors=carrier
timers=yes
timers_sess_expires=1800

[carrier]
type=aor
contact=sip:10.20.0.2:5060
qualify_frequency=30

[carrier]
type=identify
endpoint=carrier
match=10.20.0.2/32         ; IP auth: only the operator SBC address(es) on the circuit

; ---------------------------------------------------------------- voice platform, primary
[agent-a]
type=endpoint
transport=t-agent
context=from-agent
disallow=all
allow=alaw                 ; pass-through: same codec both legs = no transcoding
dtmf_mode=rfc4733
direct_media=no
media_encryption=sdes      ; SRTP; platform set to "Required"
media_encryption_optimistic=no
media_address=203.0.113.1
rtp_symmetric=yes          ; platform media comes from dynamic addresses
aors=agent-a
; production: outbound_auth=agent-a-auth  (digest credentials set on the platform's imported number)

[agent-a]
type=aor
contact=sip:203.0.113.10:5061;transport=tls
qualify_frequency=5
qualify_timeout=1

[agent-a]
type=identify
endpoint=agent-a
match=203.0.113.10

; ---------------------------------------------------------------- voice platform, secondary
; In production: a second signalling target (other region / static-IP endpoint),
; or a human overflow destination. Same settings as primary.
[agent-b]
type=endpoint
transport=t-agent
context=from-agent
disallow=all
allow=alaw
dtmf_mode=rfc4733
direct_media=no
media_encryption=sdes
media_encryption_optimistic=no
media_address=203.0.113.1
rtp_symmetric=yes
aors=agent-b

[agent-b]
type=aor
contact=sip:203.0.113.11:5061;transport=tls
qualify_frequency=5
qualify_timeout=1

[agent-b]
type=identify
endpoint=agent-b
match=203.0.113.11
